<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b6cb0">
  <meta name="description" content="Raz-Kids などの毎日の英語学習を、カレンダーのスタンプで記録するアプリ">
  <title>英語学習スタンプ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">📘 英語学習スタンプ</h1>
    <nav class="profiles" id="profiles" aria-label="使う人を切り替える"></nav>
  </header>

  <main>
    <section id="view-home" class="view" data-view="home">
      <div class="home-grid">
        <div class="card today" id="today"></div>
        <div class="card calendar" id="calendar"></div>
      </div>
    </section>

    <section id="view-history" class="view" data-view="history" hidden>
      <div class="card" id="history"></div>
    </section>

    <section id="view-settings" class="view" data-view="settings" hidden>
      <div class="card" id="settings"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="画面切り替え">
    <button class="tab is-active" data-tab="home"><span aria-hidden="true">🗓️</span>ホーム</button>
    <button class="tab" data-tab="history"><span aria-hidden="true">📜</span>履歴</button>
    <button class="tab" data-tab="settings"><span aria-hidden="true">⚙️</span>設定</button>
  </nav>

  <dialog id="dlg" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
